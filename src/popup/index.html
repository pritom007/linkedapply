<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedApply AI – ATS CV & Cover Letters</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-logo">LA</div>
        <div class="brand-text">
          <h1>LinkedApply AI</h1>
          <p class="subtitle">ATS-optimized CVs & cover letters from LinkedIn jobs</p>
        </div>
      </div>
    </header>

    <div id="job-info" class="job-info">
      <div class="loading">Loading job information...</div>
    </div>

    <div id="status-bar" class="status-bar" hidden></div>

    <div class="controls">
      <div class="control-group">
        <label for="tone">Tone:</label>
        <select id="tone">
          <option value="neutral">Neutral</option>
          <option value="formal">Formal</option>
        </select>
      </div>

      <div class="control-group">
        <label for="emphasis">Emphasis:</label>
        <select id="emphasis">
          <option value="none">None</option>
          <option value="automation">Automation</option>
          <option value="api">API</option>
          <option value="performance">Performance</option>
          <option value="leadership">Leadership</option>
        </select>
      </div>

      <div class="control-group">
        <label for="length">Length:</label>
        <select id="length">
          <option value="1-page">1 Page</option>
          <option value="2-page">2 Pages</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button id="generate-cv" class="btn btn-primary">Generate CV</button>
      <button id="generate-cover-letter" class="btn btn-secondary">Generate Cover Letter</button>
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="#" id="options-link">Edit Profile</a>
        <span class="footer-separator">•</span>
        <a href="https://www.buymeacoffee.com/your-handle" target="_blank" rel="noopener noreferrer" id="donate-link">
          Buy me a coffee (optional)
        </a>
      </div>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
